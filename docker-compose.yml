version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jh_hospital
      POSTGRES_USER: jh_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jh_dev_password_2026}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jh_admin -d jh_hospital']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jh-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aljawahir.ae
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_pass_2026}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
