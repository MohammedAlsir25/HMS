services:
  postgres:
    image: postgres:16-alpine
    container_name: jh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jh_hospital
      POSTGRES_USER: jh_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jh_dev_password_2026}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jh_admin -d jh_hospital']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jh-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aljawarih.sd
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_pass_2026}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: production
    container_name: jh-backend
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL:-postgresql://jh_admin:jh_dev_password_2026@postgres:5432/jh_hospital}
      DIRECT_URL: ${DIRECT_URL:-postgresql://jh_admin:jh_dev_password_2026@postgres:5432/jh_hospital}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-64-char-string}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-to-another-random-string}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-jh-uploads}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: jh-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
